;
; Heltec T114 NRF-TXT (custom)
;
[env:Heltec_t114_nrf_txt]
extends = nrf52_base
board = heltec_t114
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${nrf52_base.build_flags}
  -I examples/companion_radio/nrf-txt
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_t114_nrf_txt
  -I src/helpers/ui
  -D HELTEC_T114
  -D HELTEC_T114_NRF_TXT
  -D NRF52_POWER_MANAGEMENT
  -D ENV_INCLUDE_BME680=1
  -D TELEM_BME680_ADDRESS=0x77
  -D ENV_INCLUDE_GPS=1
  -D PIN_BUZZER=33
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISPLAY_CLASS=ST7789DisplayNrfTxt
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D MESH_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D BLE_DEBUG_LOGGING=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/OLEDDisplay.cpp>
  +<helpers/ui/OLEDDisplayFonts.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/nrf-txt/*.cpp>
  +<../variants/heltec_t114_nrf_txt>
lib_deps =
  ${nrf52_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  adafruit/Adafruit BME680 Library @ ^2.0.4
debug_tool = jlink
upload_protocol = nrfutil
